# --- Configuração do Banco de Dados SQLite ---
# URL de conexão: aponta para um arquivo chamado 'ailarica.db' na raiz do projeto
spring.datasource.url=jdbc:sqlite:ailarica.db
# Classe do Driver JDBC do SQLite (da dependência org.xerial)
spring.datasource.driver-class-name=org.sqlite.JDBC

# --- Inicialização do Schema (Opcional, mas recomendado) ---
# Executa o 'Schema.sql' da pasta resources toda vez que a aplicação sobe
spring.sql.init.mode=always

# Força a codificação UTF-8 para todas as respostas
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# --- Configuração do Servidor Web ---
# Define a porta onde a API vai rodar
server.port=8080